<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote History — TeakRoom</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', 'Menlo', monospace;
      --ink: #1a1612;
      --paper: #f5f3ef;
      --panel: #ffffff;
      --teak: #2c1a0e;
      --teak-light: #5c3d2e;
      --teak-tint: #f0ebe4;
      --amber: #c4702a;
      --line: #d8d3ca;
      --muted: #6b6560;
      --danger: #9e3333;
      --radius: 8px;
    }

    body.dark {
      --ink: #e8e4dc;
      --paper: #141210;
      --panel: #1e1c18;
      --teak: #c4a882;
      --teak-light: #d4bfa0;
      --teak-tint: #2a2620;
      --amber: #e09060;
      --line: #333028;
      --muted: #8a8478;
      --danger: #e06060;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--teak-tint); }

    header {
      background: var(--teak);
      color: #f2efe6;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.2rem;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-actions a,
    .header-actions button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #f2efe6;
      transition: background 0.15s;
      font-family: var(--font-body);
    }

    .header-actions a:hover,
    .header-actions button:hover {
      background: rgba(255,255,255,0.18);
    }

    header .icon-moon { display: block; }
    header .icon-sun { display: none; }
    body.dark .icon-moon { display: none; }
    body.dark .icon-sun { display: block; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty h2 {
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .quote-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      transition: box-shadow 0.15s;
    }

    .quote-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body.dark .quote-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .quote-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.86rem;
    }

    .quote-meta dt {
      font-weight: 500;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }

    .quote-meta dd {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.84rem;
    }

    .quote-meta .label-value {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quote-actions {
      display: flex;
      gap: 6px;
      align-items: start;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 5px;
      border: 1px solid var(--teak);
      background: var(--teak);
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .open-btn:hover { background: var(--teak-light); }

    .del-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      font-family: var(--font-body);
    }

    .del-btn:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .section-count {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .item-count {
      background: var(--teak-tint);
      color: var(--teak);
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
    }

    body.dark .item-count {
      background: #2a2620;
      color: #c4a882;
    }

    .total-badge {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--teak);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .quote-card {
        grid-template-columns: 1fr;
      }
      .quote-actions {
        justify-content: flex-end;
      }
      .quote-meta {
        gap: 10px;
      }
    }

    @media print {
      header { display: none; }
      .quote-actions { display: none; }
      .quote-card { break-inside: avoid; border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Quote History</h1>
    <div class="header-actions">
      <button type="button" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="icon-moon" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.5 8.5a5.5 5.5 0 01-7-7 5.5 5.5 0 107 7z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 11a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.5 2.5l1.4 1.4M12.1 12.1l1.4 1.4M13.5 2.5l-1.4 1.4M3.9 12.1l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <a href="index.html">+ New Quote</a>
    </div>
  </header>

  <main id="app">
    <div class="empty" id="emptyState">
      <h2>No saved quotes yet</h2>
      <p>Your quote history will appear here once you save or start fresh from the editor.</p>
    </div>
    <div id="quoteList"></div>
  </main>

  <script>
    'use strict';
    const HISTORY_KEY = 'teakroom-history.v1';
    const THEME_KEY = 'teakroom-theme.v1';
    const SAVE_KEY = 'teakroom-quote.v1';

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
      catch { return []; }
    }

    function writeHistory(arr) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }
      catch { /* quota */ }
    }

    function formatCurrency(n) {
      return '\u20B9' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch { return iso; }
    }

    function computeSectionTotal(items) {
      return items.reduce((sum, it) => {
        if (it.override != null && it.override !== '') return sum + Number(it.override) || 0;
        switch (it.type) {
          case 'area':     return sum + ((it.length || 0) * (it.height || 0) * (it.rate || 0));
          case 'running':  return sum + ((it.length || 0) * (it.rate || 0));
          case 'quantity': return sum + ((it.qty || 0) * (it.rate || 0));
          case 'fixed':    return sum + (it.amount || 0);
          default:         return sum;
        }
      }, 0);
    }

    function computeGrandTotal(data) {
      return data.reduce((sum, sec) => sum + computeSectionTotal(sec.items || []), 0);
    }

    function totalItems(data) {
      return data.reduce((sum, sec) => sum + (sec.items || []).length, 0);
    }

    function openQuote(id) {
      const history = loadHistory();
      const quote = history.find(q => q.id === id);
      if (!quote) return;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          meta: quote.meta,
          data: quote.data,
          step: 0,
          metaImported: {}
        }));
        window.open('index.html', '_blank');
      } catch { alert('Failed to open quote — storage may be full.'); }
    }

    function deleteQuote(id) {
      if (!confirm('Delete this saved quote?')) return;
      const history = loadHistory().filter(q => q.id !== id);
      writeHistory(history);
      render();
    }

    function render() {
      const history = loadHistory();
      const list = document.getElementById('quoteList');
      const empty = document.getElementById('emptyState');

      if (!history.length) {
        empty.style.display = '';
        list.innerHTML = '';
        return;
      }

      empty.style.display = 'none';
      list.innerHTML = history.map(q => {
        const sections = (q.data || []).length;
        const items = totalItems(q.data || []);
        const total = computeGrandTotal(q.data || []);
        const qno = (q.meta && q.meta.qno) || '\u2014';
        const client = (q.meta && q.meta.client) || '\u2014';
        const place = (q.meta && q.meta.place) || '';
        const validTill = (q.meta && q.meta.validtill) || '';

        return '<div class="quote-card" data-id="' + q.id + '">'
          + '<div>'
          +   '<div class="quote-meta">'
          +     '<div class="label-value"><dt>Quote No.</dt><dd>' + esc(qno) + '</dd></div>'
          +     '<div class="label-value"><dt>Client</dt><dd>' + esc(client) + (place ? ', ' + esc(place) : '') + '</dd></div>'
          +     '<div class="label-value"><dt>Saved</dt><dd>' + formatDate(q.savedAt) + '</dd></div>'
          +     (validTill ? '<div class="label-value"><dt>Valid Till</dt><dd>' + esc(validTill) + '</dd></div>' : '')
          +   '</div>'
          +   '<div class="section-count">'
          +     sections + ' section' + (sections !== 1 ? 's' : '')
          +     ' &middot; '
          +     '<span class="item-count">' + items + ' item' + (items !== 1 ? 's' : '') + '</span>'
          +   '</div>'
          + '</div>'
          + '<div class="quote-actions">'
          +   '<span class="total-badge">' + formatCurrency(total) + '</span>'
          +   '<button class="open-btn" onclick="openQuote(' + q.id + ')">&#x2197; Open</button>'
          +   '<button class="del-btn" onclick="deleteQuote(' + q.id + ')" title="Delete">&#x2715;</button>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* Theme */
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
    }

    function loadTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'dark') applyTheme(true);
        else if (saved === 'light') applyTheme(false);
        else applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch { /* ignore */ }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark');
      applyTheme(!isDark);
      try { localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark'); }
      catch { /* ignore */ }
    });

    loadTheme();
    render();
  </script>
</body>
</html>
