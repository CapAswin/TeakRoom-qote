<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote History — TeakRoom</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', 'Menlo', monospace;
      --ink: #111111;
      --paper: #f3f4f6;
      --panel: #ffffff;
      --teak: #111111;
      --teak-light: #374151;
      --teak-tint: #f3f4f6;
      --accent: #3b82f6;
      --line: #e5e7eb;
      --muted: #6b7280;
      --sub: #989fab;
      --danger: #ef4444;
      --bar-bg: #111111;
      --bar-fg: #ffffff;
      --strong-bg: #111111;
      --strong-fg: #ffffff;
      --radius: 20px;
    }

    body.dark {
      color-scheme: dark;
      --ink: #f4f4f5;
      --paper: #0b0b0c;
      --panel: #1c1c1f;
      --teak: #f4f4f5;
      --teak-light: #d4d4d8;
      --teak-tint: #2a2a2e;
      --accent: #60a5fa;
      --line: #3f3f46;
      --muted: #a1a1aa;
      --sub: #7f7f88;
      --danger: #f87171;
      --bar-bg: #050505;
      --bar-fg: #ffffff;
      --strong-bg: #f4f4f5;
      --strong-fg: #111111;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--teak-tint); }

    header {
      background: transparent;
      color: var(--ink);
      padding: 20px 24px 0;
      max-width: 960px;
      margin: 0 auto;
    }

    .header-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 1px 2px rgba(17, 17, 17, 0.04);
    }

    header h1 {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 1.4rem;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-actions a,
    .header-actions button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      transition: background 0.15s;
      font-family: var(--font-body);
    }

    .header-actions a {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    body.dark .header-actions a {
      color: #fff;
    }

    .header-actions a:hover {
      filter: brightness(1.08);
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 240px;
      font-size: 0.74rem;
      color: var(--muted);
      background: var(--teak-tint);
      border: 1px solid var(--line);
      padding: 4px 4px 4px 10px;
      border-radius: 999px;
    }

    .user-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .user-chip button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 8px;
      font: inherit;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .user-chip[hidden] { display: none !important; }

    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 320;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
    }
    .auth-gate[hidden] { display: none !important; }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px 26px 24px;
    }
    .auth-card h2 { margin: 0; font-size: 1.25rem; font-weight: 800; }
    .auth-card p { margin: 8px 0 0; color: var(--muted); font-size: 0.9rem; }
    .auth-card form { display: grid; gap: 6px; margin-top: 18px; }
    .auth-card label { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-top: 8px; }
    .auth-card input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
    }
    .auth-card button[type="submit"] {
      margin-top: 14px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-error { color: var(--danger); font-size: 0.85rem; }
    .auth-hint { margin-top: 16px !important; font-size: 0.78rem !important; color: var(--sub) !important; }
    body.auth-locked > header,
    body.auth-locked > main { visibility: hidden; }

    .header-actions button:hover {
      background: var(--teak-tint);
    }

    header .icon-moon { display: block; }
    header .icon-sun { display: none; }
    body.dark .icon-moon { display: none; }
    body.dark .icon-sun { display: block; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--sub);
    }

    .empty h2 {
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .quote-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      transition: box-shadow 0.15s;
    }

    .quote-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body.dark .quote-card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .quote-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.86rem;
    }

    .quote-meta dt {
      font-weight: 500;
      color: var(--sub);
      font-size: 0.7rem;
      letter-spacing: 0.02em;
    }

    .quote-meta dd {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.84rem;
    }

    .quote-meta .label-value {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quote-actions {
      display: flex;
      gap: 6px;
      align-items: start;
    }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s;
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .open-btn:hover { filter: brightness(1.08); }

    .del-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      font-family: var(--font-body);
    }

    .del-btn:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .section-count {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      color: var(--sub);
      margin-top: 4px;
    }

    .item-count {
      background: var(--teak-tint);
      color: var(--ink);
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
    }

    body.dark .item-count {
      background: var(--teak-tint);
      color: var(--ink);
    }

    body.app-loading { overflow: hidden; }

    .data-loader {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--paper);
      transition: opacity 0.2s ease;
    }
    .data-loader.is-done { opacity: 0; pointer-events: none; }
    .data-loader[hidden] { display: none !important; }
    .data-loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.06);
      padding: 28px 32px;
      min-width: 200px;
    }
    .data-loader-card p {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
    }
    .data-loader-spin {
      width: 28px;
      height: 28px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: data-loader-spin 0.7s linear infinite;
    }
    @keyframes data-loader-spin { to { transform: rotate(360deg); } }

    .total-badge {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--ink);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .quote-card {
        grid-template-columns: 1fr;
      }
      .quote-actions {
        justify-content: flex-end;
      }
      .quote-meta {
        gap: 10px;
      }
    }

    @media print {
      header { display: none; }
      .quote-actions { display: none; }
      .quote-card { break-inside: avoid; border: 1px solid #ccc; }
    }
  </style>
</head>
<body class="app-loading">
  <header>
      <div class="header-card">
        <h1>Quote History</h1>
        <div class="header-actions">
          <span class="user-chip" id="userChip" hidden>
            <span id="userEmail"></span>
            <button type="button" id="signOutBtn">Sign out</button>
          </span>
          <button type="button" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-moon" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.5 8.5a5.5 5.5 0 01-7-7 5.5 5.5 0 107 7z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-sun" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 11a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.5 2.5l1.4 1.4M12.1 12.1l1.4 1.4M13.5 2.5l-1.4 1.4M3.9 12.1l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <a href="admin.html">Admin</a>
          <a href="index.html">+ New Quote</a>
        </div>
      </div>
  </header>

  <main id="app">
    <div class="empty" id="emptyState">
      <h2>No saved quotes yet</h2>
      <p>Your quote history will appear here once you save or start fresh from the editor.</p>
    </div>
    <div id="quoteList"></div>
  </main>

  <div class="auth-gate" id="authGate" hidden>
    <div class="auth-card">
      <h2>Sign in</h2>
      <p>Use the staff account you created in Supabase.</p>
      <form id="authForm">
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="username" required placeholder="you@example.com">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" required>
        <p class="auth-error" id="authError" hidden></p>
        <button type="submit" id="authSubmit">Sign in</button>
      </form>
    </div>
  </div>

  <div class="data-loader" id="dataLoader" role="status" aria-live="polite" aria-busy="true">
    <div class="data-loader-card">
      <div class="data-loader-spin" aria-hidden="true"></div>
      <p>Loading quotes…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase.js"></script>
  <script>
    'use strict';
    const HISTORY_KEY = 'teakroom-history.v1';
    const THEME_KEY = 'teakroom-theme.v1';
    const SAVE_KEY = 'teakroom-quote.v1';

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
      catch { return []; }
    }

    function writeHistory(arr) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }
      catch { /* quota */ }
    }

    function formatCurrency(n) {
      return '\u20B9' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch { return iso; }
    }

    function computeSectionTotal(items) {
      return items.reduce((sum, it) => {
        if (it.override != null && it.override !== '') return sum + Number(it.override) || 0;
        switch (it.type) {
          case 'area':     return sum + ((it.length || 0) * (it.height || 0) * (it.rate || 0));
          case 'running':  return sum + ((it.length || 0) * (it.rate || 0));
          case 'quantity': return sum + ((it.qty || 0) * (it.rate || 0));
          case 'fixed':    return sum + (it.amount || 0);
          default:         return sum;
        }
      }, 0);
    }

    function computeGrandTotal(data) {
      return data.reduce((sum, sec) => sum + computeSectionTotal(sec.items || []), 0);
    }

    function totalItems(data) {
      return data.reduce((sum, sec) => sum + (sec.items || []).length, 0);
    }

    let displayed = [];

    async function allHistory() {
      const local = loadHistory();
      if (!window.TeakRoomDB || !TeakRoomDB.isReady()) return local;
      try {
        const remote = await TeakRoomDB.listQuotes();
        const map = new Map();
        local.forEach(q => map.set(String(q.id), q));
        remote.forEach(q => map.set(String(q.id), q));
        return Array.from(map.values()).sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
      } catch (e) {
        console.warn('Cloud history unavailable:', e.message || e);
        return local;
      }
    }

    function openQuote(id) {
      const quote = displayed.find(q => String(q.id) === String(id));
      if (!quote) return;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          meta: quote.meta,
          data: quote.data,
          step: 0,
          metaImported: {}
        }));
        window.open('index.html', '_blank');
      } catch { alert('Failed to open quote — storage may be full.'); }
    }

    async function deleteQuote(id) {
      if (!confirm('Delete this saved quote?')) return;
      writeHistory(loadHistory().filter(q => String(q.id) !== String(id)));
      if (window.TeakRoomDB && TeakRoomDB.isReady()) {
        try { await TeakRoomDB.deleteQuote(id); }
        catch (e) { console.warn('Cloud delete failed:', e.message || e); }
      }
      render();
    }

    async function render() {
      displayed = await allHistory();
      const history = displayed;
      const list = document.getElementById('quoteList');
      const empty = document.getElementById('emptyState');

      if (!history.length) {
        empty.style.display = '';
        list.innerHTML = '';
        return;
      }

      empty.style.display = 'none';
      list.innerHTML = history.map(q => {
        const sections = (q.data || []).length;
        const items = totalItems(q.data || []);
        const total = computeGrandTotal(q.data || []);
        const qno = (q.meta && q.meta.qno) || '\u2014';
        const client = (q.meta && q.meta.client) || '\u2014';
        const place = (q.meta && q.meta.place) || '';
        const validTill = (q.meta && q.meta.validtill) || '';

        return '<div class="quote-card" data-id="' + esc(String(q.id)) + '">'
          + '<div>'
          +   '<div class="quote-meta">'
          +     '<div class="label-value"><dt>Quote No.</dt><dd>' + esc(qno) + '</dd></div>'
          +     '<div class="label-value"><dt>Client</dt><dd>' + esc(client) + (place ? ', ' + esc(place) : '') + '</dd></div>'
          +     '<div class="label-value"><dt>Saved</dt><dd>' + formatDate(q.savedAt) + '</dd></div>'
          +     (validTill ? '<div class="label-value"><dt>Valid Till</dt><dd>' + esc(validTill) + '</dd></div>' : '')
          +   '</div>'
          +   '<div class="section-count">'
          +     sections + ' section' + (sections !== 1 ? 's' : '')
          +     ' &middot; '
          +     '<span class="item-count">' + items + ' item' + (items !== 1 ? 's' : '') + '</span>'
          +   '</div>'
          + '</div>'
          + '<div class="quote-actions">'
          +   '<span class="total-badge">' + formatCurrency(total) + '</span>'
          +   '<button type="button" class="open-btn">&#x2197; Open</button>'
          +   '<button type="button" class="del-btn" title="Delete">&#x2715;</button>'
          + '</div>'
          + '</div>';
      }).join('');
    }

    document.getElementById('quoteList').addEventListener('click', e => {
      const card = e.target.closest('.quote-card');
      if (!card) return;
      if (e.target.closest('.open-btn')) openQuote(card.dataset.id);
      if (e.target.closest('.del-btn')) deleteQuote(card.dataset.id);
    });

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* Theme */
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
    }

    function loadTheme() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        applyTheme(saved === 'dark');
      } catch { applyTheme(false); }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark');
      applyTheme(!isDark);
      try { localStorage.setItem(THEME_KEY, isDark ? 'light' : 'dark'); }
      catch { /* ignore */ }
    });

    loadTheme();

    function hideDataLoader() {
      const el = document.getElementById('dataLoader');
      document.body.classList.remove('app-loading');
      if (!el || el.hidden) return;
      el.setAttribute('aria-busy', 'false');
      el.classList.add('is-done');
      setTimeout(function () { el.hidden = true; }, 220);
    }

    if (window.TeakRoomDB) {
      TeakRoomDB.start().then(function () {
        if (TeakRoomDB.isConfigured() && !TeakRoomDB.isSignedIn()) {
          hideDataLoader();
          TeakRoomDB.onSignedIn(function () {
            Promise.resolve(render()).finally(hideDataLoader);
          });
          return;
        }
        return Promise.resolve(render()).finally(hideDataLoader);
      }).catch(function () {
        Promise.resolve(render()).finally(hideDataLoader);
      });
    } else {
      Promise.resolve(render()).finally(hideDataLoader);
    }
  </script>
</body>
</html>
