<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotation Editor</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="header-card">
      <div class="header-top">
        <div>
          <h1>TeakRoom</h1>
          <p class="header-sub">Create your quotation</p>
        </div>
        <div class="header-right">
          <div class="save-status no-print" title="Autosaves to this browser">
            <span class="save-dot" id="saveDot"></span>
            <span id="saveText">Ready</span>
          </div>
          <button type="button" class="icon-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 8.5a5.5 5.5 0 01-7-7 5.5 5.5 0 107 7z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 11a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.5 2.5l1.4 1.4M12.1 12.1l1.4 1.4M13.5 2.5l-1.4 1.4M3.9 12.1l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="meta-grid">
        <div>
          <label for="qno">Quotation No.</label>
          <input id="qno" value="QNBR/2025/10/109/01" autocomplete="off" placeholder="Quotation number">
        </div>
        <div>
          <label for="client">Client</label>
          <input id="client" value="Mr. Sanal" autocomplete="off" placeholder="Client name">
        </div>
        <div>
          <label for="place">Place</label>
          <input id="place" value="Kasaragod" autocomplete="off" placeholder="Place">
        </div>
        <div>
          <label for="validtill">Quote Valid Till</label>
          <input id="validtill" type="date" value="2025-10-18">
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar no-print">
      <button type="button" class="btn btn-accent" id="resetBtn" title="Save current quote to history and start a new one">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Start Fresh
      </button>
      <button type="button" class="btn" id="saveQuoteBtn" title="Save current quote to history">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 2h9l3 3v9H2V2z" stroke="currentColor" stroke-width="1.5"/><path d="M5 2v4h5V2" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="9" width="7" height="4" rx="0.5" stroke="currentColor" stroke-width="1.5"/></svg>
        Save Quote
      </button>
      <button type="button" class="btn" id="historyBtn" title="View saved quotes in a new tab">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="1" width="12" height="14" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 5h6M5 8h6M5 11h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        History
      </button>
      <button type="button" class="btn" id="roomModalBtn" title="Add rooms from the product catalog">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2a1 1 0 011 1v4l3.5 6.5a1 1 0 01-.9 1.5H4.4a1 1 0 01-.9-1.5L7 7V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Add Rooms
      </button>
      <span class="toolbar-sep"></span>
      <label class="import-btn" title="Load a previously exported .xlsx file">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M4 6l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Import Excel
        <input type="file" id="importFile" accept=".xlsx,.xls">
      </label>
      <button type="button" class="btn btn-primary" id="exportExcelBtn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 10V2M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Export Excel
      </button>
      <button type="button" class="btn" id="exportPdfBtn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 10V2M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Export PDF
      </button>
    </div>
    <div class="legend no-print">
      <span><span class="dot imp"></span>From uploaded file</span>
      <span><span class="dot man"></span>Entered manually</span>
    </div>

    <!-- View Settings -->
    <div class="view-settings no-print" id="viewSettings">
      <div class="view-settings-row">
        <div class="setting-group">
          <span class="setting-label">View</span>
          <div class="btn-group" id="viewModeGroup" role="radiogroup" aria-label="View mode">
            <button type="button" class="view-btn active" data-view="list" title="List view" aria-pressed="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="2.5" rx="0.5" fill="currentColor"/><rect x="1" y="6.75" width="14" height="2.5" rx="0.5" fill="currentColor"/><rect x="1" y="11.5" width="14" height="2.5" rx="0.5" fill="currentColor"/></svg>
              <span>List</span>
            </button>
            <button type="button" class="view-btn" data-view="grid" title="Grid view" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" fill="currentColor"/><rect x="9" y="1" width="6" height="6" rx="1" fill="currentColor"/><rect x="1" y="9" width="6" height="6" rx="1" fill="currentColor"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/></svg>
              <span>Grid</span>
            </button>
            <button type="button" class="view-btn" data-view="table" title="Table view" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="14" height="3" rx="0.5" fill="currentColor"/><rect x="1" y="5.5" width="14" height="2" rx="0.3" fill="currentColor" opacity="0.5"/><rect x="1" y="9" width="14" height="2" rx="0.3" fill="currentColor" opacity="0.5"/><rect x="1" y="12.5" width="14" height="2" rx="0.3" fill="currentColor" opacity="0.5"/></svg>
              <span>Table</span>
            </button>
            <button type="button" class="view-btn" data-view="cards" title="Cards view" aria-pressed="false">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6.5" height="6" rx="1" fill="currentColor"/><rect x="8.5" y="1" width="6.5" height="6" rx="1" fill="currentColor"/><rect x="1" y="9" width="6.5" height="6" rx="1" fill="currentColor"/><rect x="8.5" y="9" width="6.5" height="6" rx="1" fill="currentColor"/></svg>
              <span>Cards</span>
            </button>
          </div>
        </div>

        <div class="setting-group">
          <span class="setting-label">Size</span>
          <div class="btn-group" id="fontSizeGroup" role="radiogroup" aria-label="Font size">
            <button type="button" class="size-btn" data-size="small" title="Small text">S</button>
            <button type="button" class="size-btn active" data-size="default" title="Default text">M</button>
            <button type="button" class="size-btn" data-size="large" title="Large text">L</button>
            <button type="button" class="size-btn" data-size="xlarge" title="Extra large text">XL</button>
          </div>
        </div>

        <div class="setting-group">
          <label class="compact-toggle" for="compactToggle" title="Compact view">
            <input type="checkbox" id="compactToggle">
            <span class="compact-switch"></span>
            <span class="compact-text">Compact</span>
          </label>
        </div>
      </div>
    </div>

    <div class="wizard-bar no-print" role="group" aria-label="Section navigation">
      <button type="button" class="wiz-btn" id="prevBtn" aria-label="Previous section">&larr;</button>
      <span class="step-label" id="stepLabel">Section 1 of 1</span>
      <button type="button" class="wiz-btn" id="nextBtn" aria-label="Next section">&rarr;</button>
    </div>
    <div class="dots no-print" id="dots" aria-label="Jump to section"></div>

    <div id="sections"></div>
    <button type="button" class="add-section-btn no-print" id="addSectionBtn">+ Add another area / section</button>
  </main>

  <div class="grand-bar">
    <div class="grand-bar-inner">
      <span class="label">Grand Total</span>
      <span class="value mono" id="grandTotal">₹0</span>
    </div>
  </div>

  <!-- Room Selection Modal -->
  <div class="modal-overlay" id="roomModal" aria-hidden="true" role="dialog" aria-label="Choose rooms for your quotation">
    <div class="modal">
      <div class="modal-head">
        <h2>Choose rooms</h2>
        <p class="modal-sub">Select which areas to include. You can add or remove rooms later.</p>
      </div>
      <div class="modal-toolbar">
        <button type="button" class="modal-link" id="modalSelectAll">Select all</button>
        <span class="modal-sep">|</span>
        <button type="button" class="modal-link" id="modalDeselectAll">Deselect all</button>
      </div>
      <div class="modal-list" id="modalRoomList"></div>
      <div class="modal-foot">
        <button type="button" class="btn" id="modalStartFresh">Start fresh</button>
        <button type="button" class="btn btn-primary" id="modalConfirm">Start with selected</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="quote-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
